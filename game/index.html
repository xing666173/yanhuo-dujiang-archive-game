<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>雁火渡江：夏日回响</title>
    <link rel="icon" type="image/png" href="../assets/generated/stamp-yanhuo.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="game-root" data-shell-ready="false">
      <canvas id="game-canvas" aria-label="三维场景画布"></canvas>
      <output id="game-status" class="sr-only" aria-hidden="true"></output>
      <output id="quality-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></output>

      <section id="loading-view" class="game-layer loading-view" aria-live="polite" hidden>
        <p data-loading-message>正在准备场景</p>
        <progress data-loading-progress max="1" value="0"></progress>
      </section>

      <section id="main-menu" class="game-layer main-menu" aria-labelledby="game-title">
        <div class="menu-title" data-layout-region="menu-title">
          <p class="menu-kicker">2026 夏日社会实践</p>
          <h1 id="game-title">《雁火渡江：夏日回响》</h1>
          <p class="menu-subtitle">沿江走访记录</p>
        </div>
        <nav class="menu-actions" aria-label="游戏菜单" data-layout-region="menu-actions">
          <button type="button" data-action="continue" hidden><span aria-hidden="true">续</span><strong>继续旅程</strong></button>
          <button type="button" data-action="new-game"><span aria-hidden="true">始</span><strong>新的旅程</strong></button>
          <button type="button" data-action="settings"><span aria-hidden="true">设</span><strong>设置</strong></button>
          <a href="../"><span aria-hidden="true">返</span><strong>返回成果页</strong></a>
        </nav>
        <button class="pause-button" type="button" aria-label="暂停" title="暂停" data-action="pause">
          <span class="control-icon" aria-hidden="true">Ⅱ</span>
          <span class="control-label">暂停</span>
        </button>
      </section>

      <section id="hud" class="game-layer hud" aria-label="场景信息" data-layout-region="location" hidden>
        <p data-chapter-title></p>
        <p data-objective></p>
      </section>

      <section id="dialogue-layer" class="game-layer dialogue-layer" role="dialog" aria-modal="true" aria-label="剧情对话" data-layout-region="dialogue" hidden>
        <div class="dialogue-frame">
          <div class="portrait" data-portrait aria-hidden="true"></div>
          <div class="dialogue-content">
            <div class="dialogue-heading"><p class="speaker" data-speaker></p><button type="button" class="skip-button" data-skip aria-label="跳过当前对话" title="跳过当前对话">››</button></div>
            <button type="button" class="dialogue-line" data-dialogue-line aria-label="显示完整对话或继续"></button>
            <div class="choice-list" data-choice-list data-layout-region="choices"></div>
            <p class="sr-only" data-dialogue-status aria-live="polite" aria-atomic="true"></p>
          </div>
        </div>
        <aside class="history-panel" data-dialogue-history hidden aria-label="对话记录"></aside>
      </section>

      <section id="chapter-complete" class="game-layer chapter-complete" aria-label="章节完成" hidden>
        <p data-complete-summary></p>
        <ul data-complete-stats></ul>
        <ul data-complete-tasks></ul>
        <p data-complete-total></p>
      </section>

      <section id="settings-panel" class="game-layer settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
        <div class="settings-content">
          <div class="settings-heading">
            <h2 id="settings-title">设置</h2>
            <button type="button" class="close-button" aria-label="关闭设置" title="关闭设置" data-action="close-settings">×</button>
          </div>
          <fieldset class="quality-control">
            <legend>画质</legend>
            <div class="quality-options">
              <label><input type="radio" name="quality" value="auto" checked><span>自动</span></label>
              <label><input type="radio" name="quality" value="high"><span>高</span></label>
              <label><input type="radio" name="quality" value="low"><span>低</span></label>
            </div>
          </fieldset>
          <label class="range-control">音乐 <input type="range" name="music" aria-label="音乐" min="0" max="100" value="70"></label>
          <label class="range-control">环境音 <input type="range" name="ambience" aria-label="环境音" min="0" max="100" value="60"></label>
          <label class="range-control">提示音 <input type="range" name="uiSound" aria-label="提示音" min="0" max="100" value="65"></label>
          <label class="toggle-control"><input type="checkbox" name="autoPlay" aria-label="自动播放"> 自动播放</label>
          <label class="toggle-control"><input type="checkbox" name="reducedMotion" aria-label="减少动态效果"> 减少动态效果</label>
        </div>
      </section>

      <section id="field-task-layer" class="game-layer field-task-layer" role="dialog" aria-modal="true" aria-labelledby="field-task-title" aria-label="实地任务" hidden>
        <header class="field-task-heading" data-layout-region="task-header">
          <p data-field-teammate></p>
          <h2 id="field-task-title" data-field-title></h2>
          <button type="button" data-field-cancel aria-label="退出实地任务" title="退出实地任务">×</button>
        </header>
        <div class="field-task-stage" data-field-stage data-layout-region="task-stage">
          <div class="focus-stage" data-focus-stage>
            <span data-focus-target></span>
            <span data-focus-aim></span>
          </div>
          <div class="timing-stage" data-timing-stage>
            <span data-route-marker></span>
            <ol data-route-nodes></ol>
          </div>
          <div class="listening-stage" data-listening-stage>
            <span data-sound-wave></span>
          </div>
          <button type="button" data-field-action aria-label="执行当前任务" title="执行当前任务">●</button>
        </div>
        <footer class="field-task-footer" data-layout-region="task-status">
          <progress data-field-progress max="1" value="0"></progress>
          <p data-field-status aria-live="polite" aria-atomic="true"></p>
        </footer>
        <div class="field-task-result" data-field-result hidden>
          <p data-field-stars></p>
          <button type="button" data-field-submit aria-label="继续剧情" title="继续剧情">→</button>
        </div>
      </section>

      <section id="touch-controls" class="game-layer touch-controls" aria-label="触摸控制">
        <div class="joystick" data-joystick aria-hidden="true"><span></span></div>
        <button type="button" class="look-zone" data-look-zone
          aria-label="拖动调整视角" title="拖动调整视角">
          <span aria-hidden="true">↔</span><small>视角</small>
        </button>
        <button type="button" class="interact-button" data-interact aria-label="互动" title="互动">◎</button>
      </section>

      <nav id="desktop-controls" class="game-layer directional-controls" aria-label="移动方向">
        <button type="button" data-direction="up" aria-label="向前移动" title="向前移动">↑</button>
        <button type="button" data-direction="left" aria-label="向左移动" title="向左移动">←</button>
        <button type="button" data-direction="right" aria-label="向右移动" title="向右移动">→</button>
        <button type="button" data-direction="down" aria-label="向后移动" title="向后移动">↓</button>
      </nav>

      <section id="webgl-fallback" class="game-layer fallback" role="status" hidden></section>
    </main>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.min.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
    <script type="module" src="main.mjs"></script>
  </body>
</html>
